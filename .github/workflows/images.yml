name: MMPay Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: Version tag to apply to images (e.g. v1.0.3). Defaults to branch/tag ref name.
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      mmpay_app_digest: ${{ steps.build-app.outputs.digest }}
      mmpay_frontend_admin_digest: ${{ steps.build-frontend.outputs.digest }}
      mmpay_app_debug_symbols_digest: ${{ steps.build-debug.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: image-tag
        run: |
          if [[ -n "${{ inputs.version_tag }}" ]]; then
            echo "tag=${{ inputs.version_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mmpay-app
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/img-ltd/mmpay-app:${{ steps.image-tag.outputs.tag }}
            ghcr.io/img-ltd/mmpay-app:${{ github.sha }}
          provenance: true
          sbom: true

      - name: Build and push mmpay-frontend-admin
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend-admin.Dockerfile
          push: true
          tags: |
            ghcr.io/img-ltd/mmpay-frontend-admin:${{ steps.image-tag.outputs.tag }}
            ghcr.io/img-ltd/mmpay-frontend-admin:${{ github.sha }}
          provenance: true
          sbom: true

      - name: Build and push mmpay-app-debug-symbols
        id: build-debug
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/debug-symbols.Dockerfile
          push: true
          tags: |
            ghcr.io/img-ltd/mmpay-app-debug-symbols:${{ steps.image-tag.outputs.tag }}
            ghcr.io/img-ltd/mmpay-app-debug-symbols:${{ github.sha }}
          provenance: true
          sbom: true

      - name: Sign images with cosign keyless OIDC
        id: cosign-sign
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ghcr.io/img-ltd/mmpay-app@${{ steps.build-app.outputs.digest }}
          cosign sign --yes ghcr.io/img-ltd/mmpay-frontend-admin@${{ steps.build-frontend.outputs.digest }}
          cosign sign --yes ghcr.io/img-ltd/mmpay-app-debug-symbols@${{ steps.build-debug.outputs.digest }}

      - name: Resolve cosign signature manifest digests
        id: sig-digests
        run: |
          set -euo pipefail
          app_sig_tag="$(echo '${{ steps.build-app.outputs.digest }}' | sed 's/sha256:/sha256-/').sig"
          fe_sig_tag="$(echo '${{ steps.build-frontend.outputs.digest }}' | sed 's/sha256:/sha256-/').sig"
          dbg_sig_tag="$(echo '${{ steps.build-debug.outputs.digest }}' | sed 's/sha256:/sha256-/').sig"
          token="$(curl -fsSL -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            'https://ghcr.io/token?scope=repository:img-ltd/mmpay-app:pull&service=ghcr.io' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')"
          fetch_sig() {
            local repo="$1" tag="$2"
            curl -fsSIL -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}" \
              | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2; exit }'
          }
          app_sig="$(fetch_sig img-ltd/mmpay-app "$app_sig_tag")"
          fe_sig="$(fetch_sig img-ltd/mmpay-frontend-admin "$fe_sig_tag")"
          dbg_sig="$(fetch_sig img-ltd/mmpay-app-debug-symbols "$dbg_sig_tag")"
          echo "app_sig=$app_sig" >> "$GITHUB_OUTPUT"
          echo "fe_sig=$fe_sig" >> "$GITHUB_OUTPUT"
          echo "dbg_sig=$dbg_sig" >> "$GITHUB_OUTPUT"

      - name: Generate image-digest evidence draft
        run: |
          {
            echo "## MMPay v1 image digest evidence"
            echo ""
            echo "tag: ${{ steps.image-tag.outputs.tag }}"
            echo "commit_sha: ${{ github.sha }}"
            echo "workflow_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "registry_host: ghcr.io"
            echo "mmpay-app: ${{ steps.build-app.outputs.digest }}"
            echo "mmpay-frontend-admin: ${{ steps.build-frontend.outputs.digest }}"
            echo "mmpay-app-debug-symbols: ${{ steps.build-debug.outputs.digest }}"
            echo "mmpay-app-cosign-signature: ${{ steps.sig-digests.outputs.app_sig }}"
            echo "mmpay-frontend-admin-cosign-signature: ${{ steps.sig-digests.outputs.fe_sig }}"
            echo "mmpay-app-debug-symbols-cosign-signature: ${{ steps.sig-digests.outputs.dbg_sig }}"
          } >> "$GITHUB_STEP_SUMMARY"
