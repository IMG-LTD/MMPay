replicaCount: 1

image:
  repository: ghcr.io/img-ltd/mmpay-app
  tag: "v1.0.0-hotfix.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

app:
  javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
  datasource:
    url: "jdbc:postgresql://replace-with-postgres-host:5432/mmpay"
    username: "mmpay"
  redis:
    url: "redis://replace-with-redis-host:6379"
  nacosDiscoveryEnabled: "false"

secrets:
  existingSecret: "replace-with-mmpay-secret"
  keys:
    datasourcePassword: "datasource-password"
    auditHmacKey: "audit-hmac-key"
    huifuSysId: "huifu-sys-id"
    huifuProductId: "huifu-product-id"
    huifuRsaPublicKey: "huifu-rsa-public-key"
    huifuRsaPrivateKey: "huifu-rsa-private-key"
    huifuSkillSource: "huifu-skill-source"
    huifuMerchantId: "huifu-merchant-id"
    huifuNotifyUrl: "huifu-notify-url"
    huifuWebhookEndpointKey: "huifu-webhook-endpoint-key"

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 20
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
