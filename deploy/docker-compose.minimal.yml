services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mmpay
      POSTGRES_USER: mmpay
      POSTGRES_PASSWORD: replace-with-local-password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mmpay-app:
    image: mmpay-app:local
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mmpay
      SPRING_DATASOURCE_USERNAME: mmpay
      SPRING_DATASOURCE_PASSWORD: replace-with-local-password
      MMPAY_REDIS_URL: redis://redis:6379
      MMPAY_AUDIT_HMAC_KEY: ${MMPAY_AUDIT_HMAC_KEY:?Set MMPAY_AUDIT_HMAC_KEY to a base64-encoded 32-byte key}
