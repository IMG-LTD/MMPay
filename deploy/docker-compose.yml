services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mmpay
      POSTGRES_USER: mmpay
      POSTGRES_PASSWORD: replace-with-local-password
    ports:
      - "${MMPAY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - mmpay-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "${MMPAY_REDIS_PORT:-6379}:6379"
    volumes:
      - mmpay-redis-data:/data

  mmpay-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mmpay-app:local
    depends_on:
      - postgres
      - redis
    ports:
      - "${MMPAY_HTTP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mmpay
      SPRING_DATASOURCE_USERNAME: mmpay
      SPRING_DATASOURCE_PASSWORD: replace-with-local-password
      MMPAY_REDIS_URL: redis://redis:6379
      MMPAY_AUDIT_HMAC_KEY: ${MMPAY_AUDIT_HMAC_KEY:?Set MMPAY_AUDIT_HMAC_KEY to a base64-encoded 32-byte key}
      HUIFU_SYS_ID_FILE: /run/secrets/replace-with-huifu-sys-id
      HUIFU_PRODUCT_ID_FILE: /run/secrets/replace-with-huifu-product-id
      HUIFU_RSA_PUBLIC_KEY_FILE: /run/secrets/replace-with-huifu-rsa-public-key
      HUIFU_RSA_PRIVATE_KEY_FILE: /run/secrets/replace-with-huifu-rsa-private-key
      HUIFU_SKILL_SOURCE_FILE: /run/secrets/replace-with-huifu-skill-source
      HUIFU_MERCHANT_ID_FILE: /run/secrets/replace-with-huifu-merchant-id
      HUIFU_NOTIFY_URL_FILE: /run/secrets/replace-with-huifu-notify-url
      HUIFU_WEBHOOK_ENDPOINT_KEY_FILE: /run/secrets/replace-with-huifu-webhook-endpoint-key

volumes:
  mmpay-postgres-data:
  mmpay-redis-data:
